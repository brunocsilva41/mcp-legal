<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Authorization Callback - MCP Video Publisher</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
      --success: #22c55e;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      max-width: 580px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h1 {
      margin-top: 0;
      font-size: 24px;
      color: var(--success);
    }
    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }
    .code-box {
      margin: 24px 0;
      background: rgba(0,0,0,0.3);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      word-break: break-all;
      font-family: monospace;
      font-size: 14px;
      color: var(--accent);
      user-select: all;
    }
    .status {
      font-size: 13px;
      color: var(--muted);
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Authorization Received</h1>
    <p id="desc">Processing authorization code from TikTok...</p>
    <div id="codeDisplay" class="code-box">Searching for code...</div>
    <div id="status" class="status">Connecting to local MCP server...</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');

    const titleEl = document.getElementById('title');
    const descEl = document.getElementById('desc');
    const codeEl = document.getElementById('codeDisplay');
    const statusEl = document.getElementById('status');

    if (error) {
      titleEl.innerText = 'Authorization Error';
      titleEl.style.color = '#ef4444';
      descEl.innerText = params.get('error_description') || error;
      codeEl.innerText = error;
      statusEl.innerText = 'Please check your permissions and try again.';
    } else if (code) {
      codeEl.innerText = code;
      descEl.innerText = 'Authorization code received successfully. You can copy it or let automatic forwarding complete:';
      
      // Attempt forwarding to local MCP server
      const localUrl = 'http://127.0.0.1:53683/oauth2/callback?code=' + encodeURIComponent(code) + (state ? '&state=' + encodeURIComponent(state) : '');
      fetch(localUrl, { mode: 'no-cors' })
        .then(() => {
          statusEl.innerText = 'Local MCP listener notified. You may close this tab.';
        })
        .catch(() => {
          statusEl.innerText = 'If local listener is offline, copy the code above into your application.';
        });
    } else {
      codeEl.innerText = 'No code found in URL.';
      statusEl.innerText = '';
    }
  </script>
</body>
</html>
